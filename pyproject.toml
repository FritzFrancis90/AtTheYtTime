[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "podtube"
version = "0.1.0"
description = "Converting YouTube videos to Podcasts for Less Distractions"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "yt-dlp>=2024.1.0",
    "isodate>=0.6.1",
    "pytz>=2024.1",
    "mutagen>=1.47.0",
    "Pillow>=10.0.0",
    "podgen>=1.1.0",
    "boto3>=1.34.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
podtube = "podtube.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

