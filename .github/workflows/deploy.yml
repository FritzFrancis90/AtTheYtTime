name: Run Unit Tests

on:
  # Run unit tests on Pull Requests targeting main
  pull_request:
    branches:
      - main
  # Run unit tests when merged into main
  push:
    branches:
      - main
  # Allow manual one-click trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dependencies
        run: pip install -e .

      - name: Execute unit test suite
        run: python -m unittest discover -s tests -v
